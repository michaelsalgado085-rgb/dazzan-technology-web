<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#141823">
  <title>Entrar al panel — Dazzan Technology</title>
  <link rel="icon" href="/assets/img/favicon.ico" sizes="any">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/panel.css">
</head>
<body class="acceso">
  <main class="acceso__contenido">
    <div class="acceso__tarjeta">
      <div class="acceso__insignia">
        <img class="acceso__logo" src="/assets/img/logo-icono.png" alt="" width="256" height="256">
      </div>
      <p class="acceso__marca">DAZZAN <span>Technology</span></p>
      <h1 class="acceso__titulo">Panel del local</h1>
      <p class="acceso__texto">Entra para cargar tu inventario y emitir facturas.</p>

      <form id="formulario-acceso" class="formulario" novalidate>
        <div class="campo">
          <label class="campo__etiqueta" for="correo">Correo</label>
          <input class="campo__entrada" id="correo" name="correo" type="email"
            autocomplete="username" inputmode="email" placeholder="tucorreo@gmail.com" required>
        </div>
        <div class="campo">
          <label class="campo__etiqueta" for="clave">Contraseña</label>
          <input class="campo__entrada" id="clave" name="clave" type="password"
            autocomplete="current-password" required>
        </div>
        <p class="formulario__error" id="errores-acceso" role="alert" hidden></p>
        <button class="acceso__boton" type="submit">Entrar</button>
      </form>
    </div>

    <p class="acceso__lema">La tecnología que necesitas, <span>a tu alcance</span></p>
    <a class="acceso__volver" href="/">← Volver a la tienda</a>
  </main>

  <script type="module" src="/assets/js/adaptadores/entrada/login.js"></script>
</body>
</html>
